function getDocId(qi,ti,di){return `doc_${qi}_${ti}_${di}`}

function render(){
  const app=document.getElementById('app');
  let html=`<p class="page-title">SMDIF Joquicingo — CONAC AÑO 2026</p>
  <p class="page-sub">Información financiera conforme al CONAC | Sistema Municipal DIF Joquicingo</p>`;
  DATA.forEach((q,qi)=>{
    const total=q.titles.reduce((s,t)=>s+t.docs.length,0);
    html+=`<div class="quarter-block">
      <div class="q-header">${q.emoji} ${q.quarter} <span class="badge-count">${total} docs</span></div>`;
    q.titles.forEach((t,ti)=>{
      html+=`<div class="titulo-label">${t.label}</div>`;
      t.docs.forEach((d,di)=>{
        const id=getDocId(qi,ti,di);
        const btnClass=d.url?'btn-ver':'btn-ver no-url';
        const btn=d.url?`<a href="${d.url}" target="_blank" class="${btnClass}">Ver</a>`:`<span class="${btnClass}">Ver</span>`;
        html+=`<div class="doc-item" id="${id}">
          <span class="doc-name">${d.name}</span>
          ${btn}
        </div>`;
      });
    });
    html+=`</div>`;
  });
  app.innerHTML=html;
}

function buildModal(){
  const body=document.getElementById('modal-body');
  let html=`<span class="info-tag">Pega las URLs de cada documento y guarda</span>`;
  DATA.forEach((q,qi)=>{
    html+=`<div class="modal-q"><div class="modal-q-title">${q.emoji} ${q.quarter}</div>`;
    q.titles.forEach((t,ti)=>{
      html+=`<div style="font-size:0.72rem;color:#aaa;margin:6px 0 4px;font-weight:600">${t.label}</div>`;
      t.docs.forEach((d,di)=>{
        const id=getDocId(qi,ti,di);
        html+=`<div class="url-row">
          <div class="url-label">${d.name}</div>
          <input class="url-input" id="input_${id}" type="url" placeholder="https://..." value="${d.url}">
        </div>`;
      });
    });
    html+=`</div>`;
  });
  body.innerHTML=html;
}

function saveUrls(){
  DATA.forEach((q,qi)=>{
    q.titles.forEach((t,ti)=>{
      t.docs.forEach((d,di)=>{
        const id=getDocId(qi,ti,di);
        const inp=document.getElementById('input_'+id);
        if(inp) d.url=inp.value.trim();
      });
    });
  });
  render();
  closeModal();
}

function openModal(){
  buildModal();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
}

render();
</script>
